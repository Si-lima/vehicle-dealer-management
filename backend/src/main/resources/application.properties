spring.application.name=vehicle-dealer-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/vehicle_dealer_db}
spring.datasource.username=${DB_USERNAME:vehicle_user}
spring.datasource.password=${DB_PASSWORD:vehicle_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
